server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name ragflow.example.com;

    ssl_certificate certs/2.crt;
    ssl_certificate_key certs/2.key;

    include ssl.conf;
    include log.conf;
    include acme_challenge.conf;
    include force_ssl.conf;

    set $sudox_platform_service ragflow;
    include sudox-platform-browser-session.inc;

    location /api/ {
        auth_basic off;
        include proxy_ip.conf;
        include proxy_custom.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ragflow_web_12;
    }

    location / {
        access_by_lua_block {
            require("sudox-platform-auth").require_session("ragflow")
        }

        include websocket.conf;
        include proxy_ip.conf;
        include proxy_custom.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://ragflow_web_12;
    }

    include error_page.conf;
}
