server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name vibe-trading.example.com;

    ssl_certificate certs/2.crt;
    ssl_certificate_key certs/2.key;

    include ssl.conf;
    include log.conf;
    include acme_challenge.conf;
    include force_ssl.conf;

    set $sudox_platform_service vibe;
    include sudox-platform-browser-session.inc;

    location / {
        access_by_lua_block {
            require("sudox-platform-auth").require_session("vibe")
        }

        include websocket.conf;
        include sse.conf;
        set $no_cache 1;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        include proxy_ip.conf;
        include proxy_custom.conf;
        include quant-platform-headers.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 300s;
        proxy_pass http://vibe_web_12;
    }

    location = /nautilus {
        return 302 https://nautilus.example.com:11443/;
    }

    location = /403.html {
        root html;
        internal;
    }

    include error_page.conf;
}
