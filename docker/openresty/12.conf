server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name quant.example.com;

    ssl_certificate certs/2.crt;
    ssl_certificate_key certs/2.key;

    include ssl.conf;
    include log.conf;
    include acme_challenge.conf;
    include force_ssl.conf;

    set $sudox_platform_service quant;
    include sudox-platform-browser-session.inc;

    location /api/ {
        auth_basic "Quant Center";
        auth_basic_user_file /opt/om/nginx/conf/quant-platform.htpasswd;

        include proxy_ip.conf;
        include proxy_custom.conf;
        include quant-platform-headers.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 300s;
        proxy_pass http://quant_api_12/;
    }

    location / {
        access_by_lua_block {
            require("sudox-platform-auth").require_session("quant")
        }

        include proxy_ip.conf;
        include proxy_custom.conf;
        include quant-platform-headers.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://quant_center_12;
    }

    location = /403.html {
        root html;
        internal;
    }

    include error_page.conf;
}
