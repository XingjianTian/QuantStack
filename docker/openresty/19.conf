server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name raggraph.example.com;

    ssl_certificate certs/2.crt;
    ssl_certificate_key certs/2.key;

    include ssl.conf;
    include log.conf;
    include acme_challenge.conf;
    include force_ssl.conf;

    set $sudox_platform_service raggraph;
    include sudox-platform-browser-session.inc;

    location /api/ {
        # Private deployment include preserves the audited machine-client contract.
        # It must not contain a credential literal in this site file or in Git.
        include raggraph-api-compat.conf;
        include proxy_ip.conf;
        include proxy_custom.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://raggraph_web_12;
    }

    location / {
        access_by_lua_block {
            require("sudox-platform-auth").require_session("raggraph")
        }

        include websocket.conf;
        include proxy_ip.conf;
        include proxy_custom.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://raggraph_web_12;
    }

    include error_page.conf;
}
