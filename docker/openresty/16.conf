server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name auth.example.com;

    ssl_certificate certs/2.crt;
    ssl_certificate_key certs/2.key;

    include ssl.conf;
    include log.conf;
    include acme_challenge.conf;
    include force_ssl.conf;

    root /opt/om/nginx/conf/platform-login;

    location = / {
        return 302 /login/quant;
    }

    location ~ ^/login/(?<platform_service>quant|vibe|stock|nautilus|learn|ragflow|raggraph)$ {
        limit_except GET { deny all; }
        rewrite ^ /index.html break;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action https://quant.example.com:11443 https://vibe-trading.example.com:11443 https://stock-screener.example.com:11443 https://nautilus.example.com:11443 https://learn.example.com:11443 https://ragflow.example.com:11443 https://raggraph.example.com:11443; base-uri 'none'; frame-ancestors 'none'" always;
    }

    location = /login.css {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /login.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/session/(?<platform_service>quant|vibe|stock|nautilus|learn|ragflow|raggraph)$ {
        if ($request_method != POST) { return 405; }

        limit_req zone=sudox_platform_login burst=5 nodelay;
        limit_req_status 429;
        auth_basic "Sudox Platform";
        auth_basic_user_file /opt/om/nginx/conf/sudox-platform.htpasswd;

        header_filter_by_lua_block {
            if ngx.status == ngx.HTTP_UNAUTHORIZED then
                ngx.header["WWW-Authenticate"] = nil
            end
        }
        content_by_lua_block {
            require("sudox-platform-auth").issue_login_handoff(ngx.var.platform_service)
        }
    }

    location ~ ^/handoff/(?<platform_service>quant|vibe|stock|nautilus|learn|ragflow|raggraph)$ {
        if ($request_method != POST) { return 405; }
        content_by_lua_block {
            require("sudox-platform-auth").issue_session_handoff(ngx.var.platform_service)
        }
    }

    location = /logout {
        if ($request_method != POST) { return 405; }
        content_by_lua_block {
            require("sudox-platform-auth").logout_gateway()
        }
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }

    include error_page.conf;
}
