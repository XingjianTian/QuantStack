server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep the application self-contained on its private NAS endpoint too. The
    # API key is injected from a Docker secret by the official Nginx entrypoint;
    # it is never shipped in the frontend bundle or image layers.
    # Separate prefix stays behind the existing website session gateway.
    # The fictional service shares this container's loopback namespace only.
    location /brokerage-sample-api/ {
        limit_except GET POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8917;
        proxy_set_header X-Forwarded-For "";
        proxy_pass http://127.0.0.1:8917/;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Quant-API-Key "${QUANT_API_KEY}";
        proxy_pass http://quant-api:8900/;
    }

    location ~* \.(?:js|css|svg|png|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
